version: '3.8'

services:
  phils-db:
    image: postgres:16-alpine
    container_name: phils-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: phils_db
      POSTGRES_USER: phils
      POSTGRES_PASSWORD: phils_secret_password
    volumes:
      - phils_pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phils -d phils_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  phils-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: phils-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://phils:phils_secret_password@phils-db:5432/phils_db
    depends_on:
      phils-db:
        condition: service_healthy

volumes:
  phils_pgdata:
