services:
  phils-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: phils-api
    restart: unless-stopped
    ports:
      - "3010:3000"
    env_file:
      - ./server/.env
    environment:
      PORT: 3000
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  phils-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: phils-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://phils-api:3000
    depends_on:
      - phils-api
